name: validate

on:
  push:
    paths:
      - "pack/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验所有语言包
        run: |
          set -e
          shopt -s nullglob
          files=(pack/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "pack/ 下没有 json 文件"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            python scripts/verify.py "$f"
            echo "::endgroup::"
          done
